{% extends "base.html" %}

{% block title %}頁面不存在 - Pack&Go 旅行社{% endblock %}

{% block content %}
<section class="services">
    <div class="container">
        <div style="text-align: center; padding: 3rem 0;">
            <div style="font-size: 8rem; color: var(--medium-gray); margin-bottom: 1rem;">404</div>
            <h1 style="margin-bottom: 1rem;">頁面不存在</h1>
            <p style="color: var(--medium-gray); font-size: 1.1rem; margin-bottom: 2rem; max-width: 500px; margin-left: auto; margin-right: auto;">
                抱歉，您要找的頁面不存在或已被移除。請檢查網址是否正確，或返回首頁繼續瀏覽。
            </p>
            
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem;">
                <a href="{{ url_for('index') }}" class="btn btn-primary">返回首頁</a>
                <a href="{{ url_for('services') }}" class="btn btn-secondary">查看服務</a>
                <a href="{{ url_for('contact') }}" class="btn btn-secondary">聯絡我們</a>
            </div>
            
            <!-- 搜尋建議 -->
            <div style="max-width: 600px; margin: 0 auto;">
                <h3 style="margin-bottom: 1.5rem;">您可能在尋找：</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                    <div class="service-card">
                        <h4>服務項目</h4>
                        <ul style="text-align: left; padding-left: 1rem; line-height: 1.8;">
                            <li><a href="{{ url_for('service_detail', service_type='group-tour') }}">包團旅遊</a></li>
                            <li><a href="{{ url_for('service_detail', service_type='custom-tour') }}">客製旅遊</a></li>
                            <li><a href="{{ url_for('service_detail', service_type='cruise') }}">郵輪服務</a></li>
                        </ul>
                    </div>
                    
                    <div class="service-card">
                        <h4>常用頁面</h4>
                        <ul style="text-align: left; padding-left: 1rem; line-height: 1.8;">
                            <li><a href="{{ url_for('packages') }}">旅遊套裝</a></li>
                            <li><a href="{{ url_for('contact') }}">聯絡我們</a></li>
                            <li><a href="{{ url_for('admin_login') }}">管理員登入</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
