{% extends "base.html" %}

{% block title %}管理員登入 - Pack&Go 旅行社{% endblock %}

{% block content %}
<section class="services">
    <div class="container">
        <div style="max-width: 400px; margin: 3rem auto;">
            <div class="service-card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div class="logo-icon" style="margin: 0 auto 1rem;">P&G</div>
                    <h2>管理員登入</h2>
                    <p style="color: var(--medium-gray);">Pack&Go 旅行社管理系統</p>
                </div>
                
                <form method="POST" style="text-align: left;">
                    <div class="form-group">
                        <label for="username">帳號</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">密碼</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    
                    <div style="text-align: center;">
                        <button type="submit" class="btn btn-primary">登入</button>
                    </div>
                </form>
                
                <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border-gray); text-align: center;">
                    <p style="color: var(--medium-gray); font-size: 0.9rem;">
                        測試帳號: admin<br>
                        測試密碼: packgo2024
                    </p>
                    <a href="{{ url_for('index') }}" style="color: var(--medium-gray); text-decoration: none; font-size: 0.9rem;">
                        ← 返回前台網站
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
